<!DOCTYPE html>
<html>
    <head>
        <title>Project 6a - Contact Form</title>
    </head>
    <body>
        <h2>Contact Information</h2>
        <form action="">
            First name:<br>
            <input type="text" name="firstname" required><br><br>

            Last name:<br>
            <input type="text" name="lastname" required><br><br>

            E-mail:<br>
            <input type="email" name="email" required><br><br>

            Telephone:<br>
            <input type="tel" name="phone" pattern="[0-9]{4}-[0-9]{4}" required><br>
            <small>Format: 1234-5678</small><br><br>

            <input type="submit" value="Submit">
        </form>
    </body>
</html>
