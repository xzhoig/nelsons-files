<!DOCTYPE html>
<html>
<body>

<h1>Age Checker</h1>

<script>
var age = prompt("Please enter your age.", "");
age = parseInt(age, 10);

if (age >= 18) {
  document.write("<b>you are qualified to drive</b>");
} else {
  document.write("<b>you are not qualified to drive</b>");
}
</script>

</body>
</html>
